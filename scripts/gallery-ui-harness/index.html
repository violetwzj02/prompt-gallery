<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var KEY = 'prompt-gallery-theme'
        var pref = 'system'
        try {
          var stored = localStorage.getItem(KEY)
          if (stored === 'dark' || stored === 'light' || stored === 'system') pref = stored
        } catch (e) {}
        var resolved =
          pref === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : pref
        var root = document.documentElement
        root.setAttribute('data-theme', resolved)
        root.setAttribute('data-theme-pref', pref)
        root.style.colorScheme = resolved
      })()
    </script>
    <title>图鉴通用 UI 测试台</title>
    <link rel="stylesheet" href="./main.css" />
    <!-- harness-css-evidence -->
    <style>
      .harness-doc,
      .harness-account {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem 1.2rem 1.5rem;
        color: var(--text);
        background: var(--bg);
        min-width: 0;
      }
      .harness-doc { border-bottom: 1px solid var(--line); }
      .harness-account { border-top: 1px solid var(--line); }
      .harness-account__row { display: flex; flex-wrap: wrap; gap: 1.5rem; min-width: 0; }
      .harness-toolbar {
        min-height: 4rem;
        position: relative;
        padding: 0.5rem 1rem;
        border: 1px dashed var(--line-strong);
        min-width: 0;
      }
      .harness-app { min-height: 100vh; min-width: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
