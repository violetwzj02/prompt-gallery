<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>相册缓存合成测试台</title>
    <style>
      html, body { margin: 0; background: #f6f4f1; color: #222; font-family: sans-serif; }
      #root, .shell { min-height: 100vh; display: flex; flex-direction: column; }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 40;
        flex: 0 0 auto;
        background: #f6f4f1;
        box-shadow: 0 1px 0 #d8d2cb;
        padding: 0.7rem 1.2rem;
      }
      .toolbar h1 { margin: 0 0 0.45rem; font-size: 1.15rem; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; position: relative; z-index: 41; }
      .actions button { position: relative; z-index: 41; }
      button { padding: 0.4rem 0.7rem; cursor: pointer; }
      .content { flex: 1 1 auto; position: relative; min-height: 0; }
      main { padding: 0.9rem 1.2rem 1.2rem; max-width: 64rem; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 0.6rem; }
      .thumb, .stage { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
      .thumb img, .stage img { width: 100%; height: 7rem; object-fit: cover; display: block; }
      .stage img { height: min(50vh, 22rem); object-fit: contain; background: #111; }
      .ph { min-height: 7rem; display: flex; align-items: center; justify-content: center; padding: 0.6rem; text-align: center; }
      .viewer {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: #f6f4f1;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        overflow: auto;
      }
      .viewer header { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; }
      .log { color: #555; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
